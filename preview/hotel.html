<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>酒店详情还原</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <a class="linkish" href="/">← 返回列表</a>
        <h1 class="brand" id="title">酒店详情</h1>
        <p class="sub" id="sub"></p>
      </div>
    </div>

    <div class="hero" id="hero"></div>

    <div class="head-row">
      <div class="panel">
        <div class="stars" id="stars"></div>
        <div class="meta" id="address"></div>
        <div class="chips" id="features"></div>
        <h3 class="section-title">酒店设施</h3>
        <div class="fac-grid" id="facilities"></div>
        <h3 class="section-title" style="margin-top:18px">酒店简介</h3>
        <p class="meta" id="intro"></p>
      </div>
      <div class="panel">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span class="score" id="score">-</span>
          <strong id="scoreLabel"></strong>
        </div>
        <p class="meta" id="review" style="margin-top:10px"></p>
        <h3 class="section-title" style="margin-top:18px">附近</h3>
        <div class="meta" id="nearby"></div>
      </div>
    </div>

    <h2 class="section-title">房型</h2>
    <div id="rooms"></div>
  </div>

  <div class="modal-mask" id="modal">
    <div class="modal">
      <div class="gallery" id="modalGallery"></div>
      <div class="content">
        <button class="close-x" id="closeModal">×</button>
        <h2 id="modalTitle"></h2>
        <div class="meta" id="modalExtra"></div>
        <div id="modalCats"></div>
        <div style="margin-top:18px">
          <button class="btn" id="closeModal2">选择房间</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>bootHotel();</script>
</body>
</html>
